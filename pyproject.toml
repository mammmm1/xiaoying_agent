[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-planner-agent"
version = "0.1.0"
description = "可审计、支持 DeepSeek 工具调用的内容活动规划 Agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-planner = "content_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
